name: Build Platform

on:
  schedule:
    - cron: "0 22 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a stable build"
        required: true
        type: boolean

jobs:
  build:
    runs-on: ${{ matrix.arch == 'aarch64' && 'ARM64' || 'ubuntu-latest' }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Flatpak build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          build-bundle: false
          manifest-path: com.fyralabs.Sdk.json
          arch: ${{ matrix.arch }}
          branch: ${{ inputs.publish && 'stable' || 'nightly' }}
          cache: true
      - name: Upload
        uses: flatpak/flatpak-github-actions/flat-manager@v6
        with:
          repository: ${{ inputs.publish && 'stable' || 'unstable' }}
          flat-manager-url: https://manager.flatpak.fyralabs.com/
          token: ${{ secrets.FLATPAK_REPO_TOKEN }}
